#docker-compose for mrc-foods
version: "3.8"

services:

  backend:
    image: hardik558/mrc-foods:latest
    container_name: mrc-backend
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6
    container_name: mrc-mongo
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:latest
    container_name: mrc-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: mrc-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: mrc-grafana
    ports:
      - "3000:3000"

  node-exporter:
    image: prom/node-exporter
    container_name: mrc-node-exporter
    ports:
      - "9100:9100"

volumes:
  mongo-data: